name: Prototype CI Pipeline

on:
  push:
    branches: [ "main" ]
    paths:
      - 'prototype/**'
      - '.github/workflows/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'prototype/**'
      - '.github/workflows/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototype

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'
        cache-dependency-path: 'prototype/requirements.txt'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Lint with ruff
      run: |
        ruff check .

    - name: Run tests with pytest
      run: |
        pytest tests/ -v

    - name: Smoke test (End-to-End Quick Pipeline)
      run: |
        python scripts/run_full_pipeline.py --quick

    - name: Multi-Topology Demo Verification
      run: |
        python -m scripts.demo --topology all --steps 5 --seeds 42 --no_random

name: Evaluation & Benchmark Pipeline

on:
  workflow_dispatch:
    inputs:
      topology:
        description: 'Topology to benchmark (all, nsfnet, geant, abilene)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - nsfnet
          - geant
          - abilene

jobs:
  test-and-evaluate:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: prototype

    steps:
    - name: Checkout thesis repository
      uses: actions/checkout@v4

    - name: Checkout prototype repository
      uses: actions/checkout@v4
      with:
        repository: Ragingsnake/ryu-fl-rl-traffic-controller
        path: prototype

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'
        cache-dependency-path: 'prototype/requirements.txt'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Lint and Format Check with ruff
      run: |
        ruff check .
        ruff format --check .

    - name: Run unit tests with pytest
      run: |
        pytest tests/ -v

    - name: Ensure Traffic Data & Preprocessing
      run: |
        python data/generate_tm.py --topology ${{ inputs.topology || 'all' }}
        python data/preprocess.py --topology ${{ inputs.topology || 'all' }}

    - name: Run Evaluation Demo Across Scenarios & Seeds
      run: |
        python scripts/demo.py --topology ${{ inputs.topology || 'all' }} --no_random --seeds 42 --out_dir results/demo

    - name: Export Demo Results & Plots Artifact
      uses: actions/upload-artifact@v4
      with:
        name: demo-evaluation-results-${{ inputs.topology || 'all' }}
        path: |
          prototype/results/demo/**/*.png
          prototype/results/demo/**/*.csv
          prototype/results/demo/**/*.json
        if-no-files-found: warn
        retention-days: 14
